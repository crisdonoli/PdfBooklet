name: Build Windows executable

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-lxml
            mingw-w64-ucrt-x86_64-python-dateutil
            mingw-w64-ucrt-x86_64-python-packaging
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qpdf

      - name: Install Python deps
        shell: msys2 {0}
        run: |
          python -m pip install --upgrade pip --break-system-packages
          pip install pikepdf img2pdf pyinstaller --break-system-packages

      - name: Build with PyInstaller
        shell: msys2 {0}
        run: |
          pyinstaller --noconfirm --windowed \
            --name PdfBooklet \
            --add-data "pdfbooklet/data;pdfbooklet/data" \
            --add-data "pdfbooklet;pdfbooklet" \
            bin/pdfbooklet

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfBooklet-Windows
          path: dist/PdfBooklet/
